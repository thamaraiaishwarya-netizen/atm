
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Bank ATM - Withdrawal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            background: #0b1120;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: #111b30;
            padding: 18px 5%;
            border-bottom: 1px solid #263653;
        }

        .brand {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .brand span { color: #8b5cf6; }

        .main {
            max-width: 550px;
            width: 90%;
            margin: 55px auto;
        }

        .form-card {
            background: #111b30;
            border: 1px solid #263653;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            background: #26306a;
            color: #a78bfa;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 30px;
            margin-bottom: 20px;
        }

        .form-control {
            background: #0b1120;
            border: 1px solid #334155;
            color: white;
            padding: 13px;
            border-radius: 9px;
        }

        .form-control:focus {
            background: #0b1120;
            color: white;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 .2rem rgba(139,92,246,.15);
        }

        .form-control::placeholder { color: #64748b; }

        .btn-withdraw {
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            padding: 13px;
            border-radius: 9px;
            width: 100%;
            font-weight: bold;
        }

        .btn-withdraw:hover {
            color: white;
            opacity: .9;
        }

        .back-link {
            color: #a78bfa;
            text-decoration: none;
            display: inline-block;
            margin-top: 22px;
        }

        .back-link:hover { color: white; }

        .form-label { color: #cbd5e1; }

        footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="brand">
        <i class="bi bi-bank"></i>
        SECURE <span>BANK ATM</span>
    </div>
</nav>

<div class="main">
    <div class="form-card">

        <div class="icon-box">
            <i class="bi bi-cash-stack"></i>
        </div>

        <h3 class="fw-bold">Cash Withdrawal</h3>
        <p class="text-secondary mb-4">
            Withdraw money securely from your bank account.
        </p>

        <form action="{{ url_for('withdraw_route') }}" method="POST">

            <div class="mb-4">
                <label class="form-label">Account Number</label>
                <input type="text"
                       class="form-control"
                       value="{{ session.get('account_number', '') }}"
                       readonly>
            </div>

            <div class="mb-4">
                <label class="form-label">Withdrawal Amount (₹)</label>
                <input type="number"
                       name="amount"
                       class="form-control"
                       placeholder="Enter amount"
                       min="1"
                       step="0.01"
                       required>
            </div>

            <button type="submit" class="btn-withdraw">
                <i class="bi bi-check-circle"></i>
                Withdraw Money
            </button>

        </form>

        <a href="{{ url_for('dashboard') }}" class="back-link">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>

    </div>
</div>

<footer>
    © 2026 Secure Bank ATM | Secure Banking System
</footer>

</body>
</html>
